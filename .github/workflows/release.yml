name: Publish desktop release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag
        required: true
        default: v1.1.0
      source_ref:
        description: Private source branch or tag
        required: true
        default: v1.1.0

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ inputs.release_tag }}
  cancel-in-progress: false

env:
  PRODUCT_NAME: ChatGPT账号工具-711EV

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - name: Checkout private source
        shell: pwsh
        env:
          SOURCE_REPO_URL: ${{ secrets.SOURCE_REPO_URL }}
          SOURCE_REPO_AUTH: ${{ secrets.SOURCE_REPO_AUTH }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SOURCE_REPO_URL)) { throw 'SOURCE_REPO_URL is not configured' }
          if ([string]::IsNullOrWhiteSpace($env:SOURCE_REPO_AUTH)) { throw 'SOURCE_REPO_AUTH is not configured' }
          $env:GIT_TERMINAL_PROMPT = '0'
          $cloneArgs = @('--depth', '1', '--single-branch', '--branch', $env:SOURCE_REF, $env:SOURCE_REPO_URL, 'source')
          $basicFromToken = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("OAUTH_USER:$env:SOURCE_REPO_AUTH"))
          $authHeaders = @(
            "Basic $env:SOURCE_REPO_AUTH",
            "Bearer $env:SOURCE_REPO_AUTH",
            "Basic $basicFromToken"
          )
          $cloned = $false
          foreach ($authHeader in $authHeaders) {
            if (Test-Path -LiteralPath 'source') { Remove-Item -LiteralPath 'source' -Recurse -Force }
            git -c "http.extraHeader=Authorization: $authHeader" clone @cloneArgs
            if ($LASTEXITCODE -eq 0) {
              $cloned = $true
              break
            }
          }
          if (-not $cloned) { throw 'Unable to clone private source with configured authentication formats' }

      - name: Validate release inputs
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          $version = (Get-Content source/desk/package.json | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -ne "v$version") {
            throw "Release tag $env:RELEASE_TAG does not match package version $version"
          }
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw 'TAURI_SIGNING_PRIVATE_KEY is not configured'
          }

      - name: Use Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: source/desk/package-lock.json

      - name: Use stable Rust
        run: rustup default stable

      - name: Install dependencies
        working-directory: source/desk
        run: npm ci --cache "$env:RUNNER_TEMP/npm-cache"

      - name: Verify source
        working-directory: source/desk
        run: |
          npm test
          npm run check:rust

      - name: Build Windows NSIS installer and updater signature
        working-directory: source/desk
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm exec tauri -- build --bundles nsis --config src-tauri/tauri.release.conf.json

      - name: Collect Windows assets
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $version = $env:RELEASE_TAG.TrimStart('v')
          $bundle = 'source/desk/src-tauri/target/release/bundle/nsis'
          $installers = @(Get-ChildItem $bundle -File | Where-Object { $_.Name -like "*_$($version)_*-setup.exe" })
          if ($installers.Count -ne 1) { throw "Expected one Windows NSIS installer, found $($installers.Count)" }
          $signature = "$($installers[0].FullName).sig"
          if (-not (Test-Path -LiteralPath $signature)) { throw 'Windows updater signature is missing' }
          New-Item -ItemType Directory -Path release-assets -Force | Out-Null
          $installerName = "ChatGPT-711EV-$version-Windows.exe"
          $signatureName = "ChatGPT-711EV-$version-Windows.exe.sig"
          Copy-Item $installers[0].FullName "release-assets/$installerName"
          Copy-Item $signature "release-assets/$signatureName"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v6
        with:
          name: windows-installer
          path: release-assets/*
          if-no-files-found: error

  build-macos:
    name: Build macOS Universal package
    runs-on: macos-14
    steps:
      - name: Checkout private source
        shell: bash
        env:
          SOURCE_REPO_URL: ${{ secrets.SOURCE_REPO_URL }}
          SOURCE_REPO_AUTH: ${{ secrets.SOURCE_REPO_AUTH }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          test -n "${SOURCE_REPO_URL// }" || { echo 'SOURCE_REPO_URL is not configured' >&2; exit 1; }
          test -n "${SOURCE_REPO_AUTH// }" || { echo 'SOURCE_REPO_AUTH is not configured' >&2; exit 1; }
          clone_args=(--depth 1 --single-branch --branch "$SOURCE_REF" "$SOURCE_REPO_URL" source)
          export GIT_TERMINAL_PROMPT=0
          basic_from_token="$(printf 'OAUTH_USER:%s' "$SOURCE_REPO_AUTH" | base64 | tr -d '\n')"
          auth_headers=(
            "Basic ${SOURCE_REPO_AUTH}"
            "Bearer ${SOURCE_REPO_AUTH}"
            "Basic ${basic_from_token}"
          )
          cloned=false
          for auth_header in "${auth_headers[@]}"; do
            rm -rf source
            if git -c "http.extraHeader=Authorization: ${auth_header}" clone "${clone_args[@]}"; then
              cloned=true
              break
            fi
          done
          if [[ "$cloned" != true ]]; then
            echo 'Unable to clone private source with configured authentication formats' >&2
            exit 1
          fi

      - name: Validate release inputs
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./source/desk/package.json').version")"
          test "$RELEASE_TAG" = "v$version"
          test -n "$TAURI_SIGNING_PRIVATE_KEY"

      - name: Use Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: source/desk/package-lock.json

      - name: Use stable Rust
        shell: bash
        run: |
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install dependencies
        working-directory: source/desk
        run: npm ci --cache "$RUNNER_TEMP/npm-cache"

      - name: Verify source
        working-directory: source/desk
        run: |
          npm test
          npm run check:rust

      - name: Build macOS Universal installer and updater package
        working-directory: source/desk
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm exec tauri -- build --target universal-apple-darwin --bundles app,dmg --config src-tauri/tauri.release.conf.json

      - name: Collect macOS assets
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          bundle='source/desk/src-tauri/target/universal-apple-darwin/release/bundle'
          dmg="$(find "$bundle/dmg" -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          updater="$(find "$bundle/macos" -maxdepth 1 -type f -name '*.app.tar.gz' -print -quit)"
          test -n "$dmg"
          test -n "$updater"
          test -f "$updater.sig"
          mkdir -p release-assets
          cp "$dmg" "release-assets/ChatGPT-711EV-${version}-macOS.dmg"
          cp "$updater" "release-assets/ChatGPT-711EV-${version}-macOS.app.tar.gz"
          cp "$updater.sig" "release-assets/ChatGPT-711EV-${version}-macOS.app.tar.gz.sig"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v6
        with:
          name: macos-installer
          path: release-assets/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public release files
        uses: actions/checkout@v5

      - name: Use Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Download release assets
        uses: actions/download-artifact@v7
        with:
          pattern: '*-installer'
          path: release-assets
          merge-multiple: true

      - name: Create updater manifest
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: node .github/scripts/create-update-manifest.mjs release-assets "$GITHUB_REPOSITORY" "$RELEASE_TAG"

      - name: Verify release assets
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          test "$(find release-assets -maxdepth 1 -type f | wc -l | tr -d ' ')" = '6'
          test -f "release-assets/ChatGPT-711EV-${version}-Windows.exe"
          test -f "release-assets/ChatGPT-711EV-${version}-Windows.exe.sig"
          test -f "release-assets/ChatGPT-711EV-${version}-macOS.dmg"
          test -f "release-assets/ChatGPT-711EV-${version}-macOS.app.tar.gz"
          test -f "release-assets/ChatGPT-711EV-${version}-macOS.app.tar.gz.sig"
          test -f 'release-assets/latest.json'

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          release_detail="ChatGPT账号工具-711EV ${version} 正式版本。"
          release_notes_path=".github/release-notes/${RELEASE_TAG}.txt"
          if [[ -f "$release_notes_path" ]]; then
            release_detail="$(cat "$release_notes_path")"
          fi
          cat > release-notes.md <<EOF
          ## 本次更新

          - 发布 ChatGPT账号工具-711EV ${version} 正式版本。
          - ${release_detail}

          ## 下载说明

          - Windows端：下载 ChatGPT账号工具-711EV-${version}-Windows端安装包.exe。
          - macOS端：下载 ChatGPT账号工具-711EV-${version}-macOS端安装包.dmg，支持 Intel 和 Apple Silicon。
          EOF
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "ChatGPT账号工具-711EV" --notes-file release-notes.md --latest release-assets/*
          fi
          node .github/scripts/upload-release-assets.mjs release-assets "$GITHUB_REPOSITORY" "$RELEASE_TAG"
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --title "ChatGPT账号工具-711EV" --notes-file release-notes.md --draft=false --latest
